services:
  coeiroink-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50031:50031"
    volumes:
      - ./speaker_info:/opt/voicevox_engine/speaker_info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped